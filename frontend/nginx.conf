server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Un dossier de candidature, c'est des scans : diplômes, attestations, pièce
    # d'identité. Nginx refuse par défaut tout corps de requête au-delà d'un
    # mégaoctet, et il le refuse *avant* que l'application le voie — le candidat
    # reçoit un 413 en anglais, sorti d'une page d'erreur nginx, après avoir
    # rempli le formulaire. Pratiquement aucun dossier réel ne passe sous cette
    # barre.
    #
    # `0` lève le plafond. Ce n'est pas une porte ouverte : l'application garde
    # son propre garde-fou sur les dépôts publics (voir `PLAFOND_ABSOLU_MO`), et
    # lui sait refuser en français, en nommant le fichier fautif.
    #
    # ATTENTION : cette directive ne vaut que pour *ce* serveur. Si un autre
    # proxy se trouve devant — terminaison TLS, répartiteur du prestataire —,
    # c'est lui qui refusera, et il faut l'y régler aussi.
    client_max_body_size 0;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Single-page app: every unknown path is a client route (/apply/<key>,
    # /sessions/<id>, ...), so hand them all to index.html.
    location / {
        add_header Cache-Control "no-cache";
        # Répétés ici : un add_header dans un bloc location annule ceux du
        # niveau supérieur. Refuser l'affichage en cadre empêche qu'une autre
        # page superpose de faux boutons à l'écran de connexion.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
